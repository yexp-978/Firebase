<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeTech - Productos</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header id="coffeetech-navbar"></header>

  <main class="page-container">
    <div class="page-header">
      <div>
        <h1>Productos</h1>
        <p>Agrega productos nuevos o modifica los que ya están registrados.</p>
      </div>
    </div>

    <div id="role-notice-productos" class="alert alert-warning hidden">
      Solo los usuarios con rol de Administrador pueden agregar, editar o eliminar productos.
    </div>

    <section id="card-form-producto" class="card">
      <div class="card-header">
        <h3 id="prod-form-title">Agregar producto</h3>
        <span id="prod-next-id-hint" class="id-pill">ID: Prod_...</span>
      </div>

      <div id="prod-validation-msg" class="alert alert-error hidden"></div>

      <form id="form-producto" class="form-grid" novalidate>
        <input type="hidden" id="prod-id">

        <div class="form-group">
          <label for="prod-nombre">Nombre</label>
          <input type="text" id="prod-nombre" placeholder="Ej. Cafe, Mollete" required>
        </div>

        <div class="form-group">
          <label for="prod-categoria">Categoría</label>
          <select id="prod-categoria" required>
            <option value="Bebida">Bebida</option>
            <option value="Comida">Comida</option>
            <option value="Minorista">Minorista</option>
            <option value="Postre">Postre</option>
          </select>
        </div>

        <div class="form-group">
          <label for="prod-precio">Precio ($)</label>
          <input type="number" id="prod-precio" min="1" step="0.5" placeholder="Ej. 90" required>
        </div>

        <div class="form-group">
          <label for="prod-stock">Stock</label>
          <input type="number" id="prod-stock" min="0" step="1" placeholder="Ej. 25" required>
        </div>

        <div class="form-group">
          <label for="prod-disponible">Disponible</label>
          <select id="prod-disponible">
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </div>

        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="prod-descripcion">Descripción</label>
          <input type="text" id="prod-descripcion" placeholder="Descripción corta del producto" required>
        </div>

        <div style="display:flex;gap:0.5rem;grid-column: 1 / -1;">
          <button type="submit" id="btn-prod-guardar" class="btn btn-primary">Guardar producto</button>
          <button type="button" id="btn-prod-cancelar" class="btn btn-secondary hidden">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h3>Lista de productos (<span id="count-productos">0</span>)</h3>
        <div class="toolbar" style="margin-bottom:0;">
          <input type="text" id="filtro-prod-texto" placeholder="Buscar producto...">
          <select id="filtro-prod-categoria">
            <option value="">Todas las categorías</option>
            <option value="Bebida">Bebida</option>
            <option value="Comida">Comida</option>
            <option value="Minorista">Minorista</option>
            <option value="Postre">Postre</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Disponible</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos-body">
            <tr><td colspan="7" class="empty-state">Cargando productos...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="./js/productos.js"></script>
</body>
</html>
