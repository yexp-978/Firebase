<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeTech - Clientes</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header id="coffeetech-navbar"></header>

  <main class="page-container">
    <div class="page-header">
      <div>
        <h1>Clientes</h1>
        <p>Registra clientes nuevos o edita sus datos de contacto.</p>
      </div>
    </div>

    <div id="role-notice-clientes" class="alert alert-warning hidden">
      Necesitas iniciar sesión como Empleado o Administrador para modificar clientes.
    </div>

    <section class="card">
      <div class="card-header">
        <h3 id="cli-form-title">Agregar cliente</h3>
        <span id="cli-next-id-hint" class="id-pill">ID: Cliente_...</span>
      </div>

      <div id="cli-validation-msg" class="alert alert-error hidden"></div>

      <form id="form-cliente" class="form-grid" novalidate>
        <input type="hidden" id="cli-id">

        <div class="form-group">
          <label for="cli-nombre">Nombre</label>
          <input type="text" id="cli-nombre" placeholder="Ej. Maria" required>
        </div>

        <div class="form-group">
          <label for="cli-telefono">Teléfono (10 dígitos)</label>
          <input type="tel" id="cli-telefono" placeholder="Ej. 6142039418" required>
        </div>

        <div class="form-group">
          <label for="cli-correo">Correo</label>
          <input type="email" id="cli-correo" placeholder="Ej. maria@gmail.com" required>
        </div>

        <div style="display:flex;gap:0.5rem;">
          <button type="submit" id="btn-cli-guardar" class="btn btn-primary">Guardar cliente</button>
          <button type="button" id="btn-cli-cancelar" class="btn btn-secondary hidden">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h3>Clientes registrados (<span id="count-clientes">0</span>)</h3>
        <input type="text" id="filtro-cli-texto" placeholder="Buscar cliente..." style="width:auto;min-width:240px;">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Teléfono</th>
              <th>Correo</th>
              <th>Fecha de registro</th>
              <th>Pedidos</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-clientes-body">
            <tr><td colspan="7" class="empty-state">Cargando clientes...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="./js/clientes.js"></script>
</body>
</html>
