<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeTech - Iniciar Sesión</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-header">
      <div class="brand-logo">☕</div>
      <h1>CoffeeTech</h1>
      <p>Inicia sesión con tu cuenta de Administrador o Empleado</p>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Correo electrónico (Gmail)</label>
        <input
          type="email"
          id="login-email"
          placeholder="ejemplo@gmail.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input
          type="password"
          id="login-password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="btn-login" class="btn btn-primary btn-block" style="margin-top:0.5rem;">
        Iniciar sesión
      </button>
    </form>

    <div id="auth-error" class="alert alert-error hidden" style="margin-top:1rem;margin-bottom:0;"></div>
    <div id="auth-success" class="alert alert-success hidden" style="margin-top:1rem;margin-bottom:0;"></div>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
